services:
  proxy:
    build: .
    ports:
      - "4000:4000"
    volumes:
      # Persist the SQLite database outside the container
      - escrow-data:/data
    environment:
      # Set to restrict dashboard and /mcp access to key holders.
      # Leave unset for open dev mode.
      - ESCROW_API_KEY=${ESCROW_API_KEY:-}
      # Set to forward approved tool calls to a real MCP server.
      - MCP_UPSTREAM_URL=${MCP_UPSTREAM_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mount a file containing just the scrape key (no newline).
      # Create it with: echo -n "$ESCROW_SCRAPE_KEY" > escrow_scrape_key.txt
      - ./escrow_scrape_key.txt:/etc/prometheus/escrow_scrape_key.txt:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      - proxy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/escrow.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  escrow-data:
  prometheus-data:
  grafana-data:
