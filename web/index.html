<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Escrow — Reviewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.18s ease-out; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse-dot { animation: pulse-dot 1.5s infinite; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-gray-800 bg-gray-950/95 backdrop-blur px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="font-semibold tracking-tight">Agent Escrow</span>
      <span id="badge"
        class="hidden bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-full tabular-nums">0</span>
    </div>
    <div class="flex items-center gap-5 text-sm text-gray-500">
      <span class="flex items-center gap-1.5">
        <span id="live-dot" class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-green-500"></span>
        <span id="last-refresh">connecting…</span>
      </span>
      <a href="/docs" target="_blank" class="hover:text-gray-200 transition-colors">API docs ↗</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10 space-y-12">

    <!-- Pending queue -->
    <section>
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-5">
        Pending Review
      </h2>
      <div id="pending-list" class="space-y-4">
        <p id="empty-msg" class="text-gray-600 text-sm">No pending actions — queue is clear.</p>
      </div>
    </section>

    <!-- History -->
    <section>
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-5">
        History
      </h2>
      <div class="rounded-lg border border-gray-800 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-900">
            <tr class="text-gray-500 text-left text-xs uppercase tracking-wide">
              <th class="px-4 py-3 font-medium">Time</th>
              <th class="px-4 py-3 font-medium">Tool</th>
              <th class="px-4 py-3 font-medium">Risk</th>
              <th class="px-4 py-3 font-medium">Decision</th>
              <th class="px-4 py-3 font-medium">Note</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr>
              <td colspan="5" class="px-4 py-6 text-gray-600 text-sm">No history yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // -------------------------------------------------------------------------
    // Constants
    // -------------------------------------------------------------------------

    const RISK = {
      CRITICAL: 'border-red-700 bg-red-950 text-red-300',
      HIGH:     'border-orange-700 bg-orange-950 text-orange-300',
      MEDIUM:   'border-yellow-700 bg-yellow-950 text-yellow-300',
      LOW:      'border-green-700 bg-green-950 text-green-300',
    };

    const CATEGORY_COLOR = {
      DATABASE:      'text-blue-400',
      FINANCIAL:     'text-yellow-400',
      COMMUNICATION: 'text-purple-400',
      GENERIC_WRITE: 'text-gray-400',
      READ:          'text-green-400',
    };

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function relTime(iso) {
      if (!iso) return '–';
      const s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 5)   return 'just now';
      if (s < 60)  return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      return new Date(iso).toLocaleTimeString();
    }

    function riskBadge(level) {
      const cls = RISK[level] || 'border-gray-700 bg-gray-900 text-gray-300';
      return `<span class="inline-block border text-xs font-bold px-2 py-0.5 rounded ${cls}">${esc(level)}</span>`;
    }

    function catLabel(cat) {
      const cls = CATEGORY_COLOR[cat] || 'text-gray-400';
      return `<span class="text-xs ${cls}">${esc(cat)}</span>`;
    }

    // -------------------------------------------------------------------------
    // Card rendering
    // -------------------------------------------------------------------------

    function renderCard(a) {
      const argsStr = JSON.stringify(a.raw_arguments || {}, null, 2);
      return `
        <div id="card-${a.id}" class="fade-in border border-gray-800 rounded-xl bg-gray-900 p-5 space-y-4">

          <!-- title row -->
          <div class="flex items-start justify-between gap-3">
            <div class="space-y-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-semibold text-white truncate">${esc(a.tool_name)}</span>
                ${riskBadge(a.risk_level)}
                ${catLabel(a.category)}
              </div>
              <p class="text-xs text-gray-500">${relTime(a.created_at)}</p>
            </div>
          </div>

          <!-- agent reason -->
          ${a.reason && a.reason !== 'No justification provided by agent.'
            ? `<p class="text-sm text-gray-300 italic border-l-2 border-gray-700 pl-3">${esc(a.reason)}</p>`
            : ''}

          <!-- args accordion -->
          <details class="group text-xs">
            <summary class="cursor-pointer select-none text-gray-500 hover:text-gray-300 transition-colors list-none flex items-center gap-1">
              <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M7.293 4.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L11.586 10 7.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
              Arguments
            </summary>
            <pre class="mt-2 bg-gray-950 border border-gray-800 rounded-lg p-3 overflow-x-auto text-gray-300 leading-relaxed">${esc(argsStr)}</pre>
          </details>

          <!-- actions -->
          <div class="flex items-center gap-3 pt-1">
            <button onclick="approve('${a.id}')"
              class="px-4 py-2 bg-green-800 hover:bg-green-700 active:bg-green-900 text-green-100 text-sm rounded-lg font-medium transition-colors">
              Approve
            </button>

            <!-- reject: button → inline form -->
            <button id="reject-btn-${a.id}" onclick="showReject('${a.id}')"
              class="px-4 py-2 bg-red-900 hover:bg-red-800 active:bg-red-950 text-red-200 text-sm rounded-lg font-medium transition-colors">
              Reject
            </button>
            <div id="reject-form-${a.id}" class="hidden flex-1 flex items-center gap-2">
              <input id="reject-reason-${a.id}" type="text" placeholder="Reason (optional)"
                class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-red-500 transition-colors"
                onkeydown="if(event.key==='Enter') confirmReject('${a.id}'); if(event.key==='Escape') cancelReject('${a.id}')">
              <button onclick="confirmReject('${a.id}')"
                class="px-3 py-2 bg-red-700 hover:bg-red-600 text-white text-sm rounded-lg font-medium transition-colors whitespace-nowrap">
                Confirm
              </button>
              <button onclick="cancelReject('${a.id}')"
                class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm rounded-lg font-medium transition-colors">
                ✕
              </button>
            </div>
          </div>

        </div>`;
    }

    // -------------------------------------------------------------------------
    // Reject UX
    // -------------------------------------------------------------------------

    function showReject(id) {
      document.getElementById(`reject-btn-${id}`).classList.add('hidden');
      const form = document.getElementById(`reject-form-${id}`);
      form.classList.remove('hidden');
      form.classList.add('flex');
      document.getElementById(`reject-reason-${id}`).focus();
    }

    function cancelReject(id) {
      document.getElementById(`reject-btn-${id}`).classList.remove('hidden');
      const form = document.getElementById(`reject-form-${id}`);
      form.classList.add('hidden');
      form.classList.remove('flex');
    }

    // -------------------------------------------------------------------------
    // Resolve
    // -------------------------------------------------------------------------

    async function approve(id) { await resolve(id, 'APPROVED', null); }

    async function confirmReject(id) {
      const reason = document.getElementById(`reject-reason-${id}`).value.trim() || null;
      await resolve(id, 'REJECTED', reason);
    }

    async function resolve(id, decision, reason) {
      const card = document.getElementById(`card-${id}`);
      if (card) { card.style.opacity = '0.4'; card.style.pointerEvents = 'none'; }

      try {
        const r = await fetch('/api/resolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action_id: id, decision, rejection_reason: reason }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          alert(err.detail || `Error ${r.status}`);
          if (card) { card.style.opacity = '1'; card.style.pointerEvents = ''; }
          return;
        }
      } catch (e) {
        alert(`Network error: ${e.message}`);
        if (card) { card.style.opacity = '1'; card.style.pointerEvents = ''; }
        return;
      }

      knownIds.delete(id);
      if (card) card.remove();
      syncEmptyState();
      refreshHistory();
    }

    // -------------------------------------------------------------------------
    // Pending polling
    // -------------------------------------------------------------------------

    const knownIds = new Set();

    function syncEmptyState() {
      const list = document.getElementById('pending-list');
      const count = knownIds.size;
      const badge = document.getElementById('badge');
      badge.textContent = count;
      count > 0 ? badge.classList.remove('hidden') : badge.classList.add('hidden');

      const hasEmpty = !!document.getElementById('empty-msg');
      if (count === 0 && !hasEmpty) {
        list.innerHTML = '<p id="empty-msg" class="text-gray-600 text-sm">No pending actions — queue is clear.</p>';
      } else if (count > 0 && hasEmpty) {
        document.getElementById('empty-msg').remove();
      }
    }

    async function refreshPending() {
      try {
        const r = await fetch('/api/pending');
        if (!r.ok) return;
        const actions = await r.json();

        const list = document.getElementById('pending-list');
        const serverIds = new Set(actions.map(a => a.id));

        // Remove cards that disappeared server-side
        for (const id of [...knownIds]) {
          if (!serverIds.has(id)) {
            document.getElementById(`card-${id}`)?.remove();
            knownIds.delete(id);
          }
        }

        // Prepend new arrivals
        for (const a of actions) {
          if (!knownIds.has(a.id)) {
            const empty = document.getElementById('empty-msg');
            if (empty) empty.remove();
            list.insertAdjacentHTML('afterbegin', renderCard(a));
            knownIds.add(a.id);
          }
        }

        syncEmptyState();
        document.getElementById('last-refresh').textContent =
          `updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        document.getElementById('last-refresh').textContent = 'connection error';
        document.getElementById('live-dot').classList.replace('bg-green-500', 'bg-red-500');
      }
    }

    // -------------------------------------------------------------------------
    // History polling
    // -------------------------------------------------------------------------

    async function refreshHistory() {
      try {
        const r = await fetch('/api/history?limit=25');
        if (!r.ok) return;
        const rows = await r.json();
        const tbody = document.getElementById('history-body');

        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-gray-600 text-sm">No history yet.</td></tr>';
          return;
        }

        tbody.innerHTML = rows.map(row => {
          const approved = row.status === 'APPROVED';
          const decCls = approved ? 'text-green-400 font-semibold' : 'text-red-400 font-semibold';
          return `
            <tr class="border-t border-gray-800 hover:bg-gray-900/40 transition-colors">
              <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">${relTime(row.resolved_at)}</td>
              <td class="px-4 py-3 text-white">${esc(row.tool_name)}</td>
              <td class="px-4 py-3">${riskBadge(row.risk_level)}</td>
              <td class="px-4 py-3 ${decCls}">${esc(row.status)}</td>
              <td class="px-4 py-3 text-gray-500 text-xs max-w-xs truncate">${esc(row.rejection_reason || '–')}</td>
            </tr>`;
        }).join('');
      } catch (_) {}
    }

    // -------------------------------------------------------------------------
    // Boot
    // -------------------------------------------------------------------------

    refreshPending();
    refreshHistory();
    setInterval(refreshPending, 3000);
    setInterval(refreshHistory, 5000);
  </script>

</body>
</html>
