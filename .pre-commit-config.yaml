repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: .venv/bin/python -m pytest -m "not e2e" -q
        language: system
        pass_filenames: false
        files: \.(py|yaml)$
