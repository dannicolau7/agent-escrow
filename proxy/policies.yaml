version: "3.0"

rules:
  # A tool is auto-approved only when its FIRST word is one of these verbs and
  # no mutation rule below matches.  Words are split on _ - . and camelCase,
  # so "get_user", "get-user" and "getUser" all start with "get".
  auto_approve_verbs:
    - get
    - list
    - search
    - read
    - describe

  # Words that chain a second operation onto a read.  Any tool name containing
  # one of these is held, so "get_and_remove_user" can't sneak through.
  chain_words: [and, then, or, also, plus]

  # Mutation rules, evaluated in order; first match wins.
  # `words` match whole words of the tool name (case-insensitive).
  # `pattern` (optional) is a regex matched against the full name.
  # `override_read: true` makes the rule hold even names that start with a
  # read verb ("get_user_delete").  Other rules only apply to names that do
  # NOT start with a read verb, so "read_email" and "get_post" stay reads.
  mutations:
    - words: [delete, drop, destroy, truncate, purge, remove, erase, wipe, kill,
              terminate, rm, del, reset, revoke, shutdown, uninstall]
      risk_level: CRITICAL
      category: DATABASE
      override_read: true
    - words: [refund, charge, transfer, pay, payout, withdraw, deposit, wire,
              purchase, buy, sell, trade, capture]
      risk_level: HIGH
      category: FINANCIAL
    - words: [send, email, mail, notify, message, publish, post, tweet, reply, invite]
      risk_level: MEDIUM
      category: COMMUNICATION
    - words: [update, write, push, create, insert, modify, edit, upload, set, put,
              patch, move, rename, merge, commit, deploy, execute, exec, run,
              apply, approve, grant, add, save, replace, restore, import]
      risk_level: MEDIUM
      category: GENERIC_WRITE

# ---------------------------------------------------------------------------
# Argument rules: decide on what a call DOES, not only its name.
# Full reference: proxy/arg_rules.py and README "Argument rules".
#
#   action: hold   → hold the call and raise risk (never lowers it). Beats
#                    always_allow and allow rules. If an argument is present
#                    but can't be checked (wrong type, too long), it HOLDS.
#   action: allow  → auto-approve, but only if every condition matches with
#                    the expected types. Never overrides always_hold.
#
#   tools: [exact_names]  and/or  tool_pattern: "regex on the tool name"
#   when:  {argument.path: {operator: value}, ...}  — all must match.
#          "*" = any key or value anywhere in the arguments (hold rules only).
#   operators: regex, not_regex, equals, in, gt, gte, lt, lte, exists
#   String comparisons ignore case and surrounding spaces.
# ---------------------------------------------------------------------------
argument_rules:
  - name: sql-destructive
    action: hold
    risk_level: CRITICAL
    category: DATABASE
    tool_pattern: "sql|query|database|postgres|mysql|sqlite|(^|[_.-])db([_.-]|$)"
    when:
      "*": {regex: "\\b(drop|truncate|delete|alter)\\b"}

  - name: sql-write
    action: hold
    risk_level: HIGH
    category: DATABASE
    tool_pattern: "sql|query|database|postgres|mysql|sqlite|(^|[_.-])db([_.-]|$)"
    when:
      "*": {regex: "\\b(insert|update|merge|upsert|replace|create|grant|revoke|rename|copy|call|exec|execute|lock|vacuum|into)\\b"}

  - name: shell-destructive
    action: hold
    risk_level: CRITICAL
    category: SYSTEM
    tool_pattern: "shell|command|bash|terminal|exec|cmd|ssh"
    when:
      "*": {regex: "\\brm\\s+-\\w*[rf]|\\bmkfs|\\bdd\\s+if=|\\b(shutdown|reboot|halt)\\b|\\bchmod\\s+-R\\b|>\\s*/dev/(sd|nvme|disk)|\\b(curl|wget)\\b[^|\\n]{0,500}\\|\\s*(ba|z)?sh\\b|:\\(\\)\\s*\\{"}

  # --- Examples (uncomment and adapt) -------------------------------------
  #
  # Auto-approve read-only SQL on one tool. Prefer a read-only database
  # user as well: a regex can't prove a query is harmless.
  # - name: sql-select-only
  #   action: allow
  #   tools: [run_sql]
  #   when:
  #     query:
  #       regex: "^\\s*(select|with|explain)\\b[^;]*;?\\Z"
  #       not_regex: "\\b(insert|update|delete|drop|alter|truncate|create|grant|revoke|merge|call|exec|execute|into|copy|lock|set|pg_\\w+|lo_\\w+|dblink\\w*|load_file|outfile|sleep|benchmark)\\b"
  #
  # Refunds: auto-approve up to $50, hold bigger ones as HIGH.
  # - name: small-refund
  #   action: allow
  #   tools: [refund_payment]
  #   when:
  #     amount: {lte: 50}
  #     currency: {in: [usd]}
  # - name: large-refund
  #   action: hold
  #   risk_level: HIGH
  #   category: FINANCIAL
  #   tools: [refund_payment]
  #   when:
  #     amount: {gt: 50}
  #
  # Anything touching production is at least HIGH.
  # - name: production-env
  #   action: hold
  #   risk_level: HIGH
  #   when:
  #     environment: {in: [prod, production]}

# Named tools that always require human approval, regardless of rules.
always_hold:
  - execute_code
  - run_command
  - deploy
  - git_reset
  - merge_pr

# Named tools that are always safe, regardless of rules.
always_allow:
  - web_search
  - git_log
  - git_status
  - git_diff
  - git_show

# Fallback for tools not matched by any rule above: always hold.
default_action: hold
