version: "2.0"

rules:
  # Auto-approve these tool prefixes (evaluated AFTER mutation patterns so a
  # name like "get_and_delete_user" is never accidentally approved).
  auto_approve_prefixes:
    - "get_"
    - "list_"
    - "search_"
    - "read_"
    - "describe_"

  # Mutation patterns evaluated in order; first match wins.
  mutations:
    - pattern: ".*delete.*|.*drop.*|.*destroy.*|.*truncate.*|.*purge.*"
      risk_level: CRITICAL
      category: DATABASE
    - pattern: ".*refund.*|.*charge.*|.*transfer.*|.*pay.*"
      risk_level: HIGH
      category: FINANCIAL
    - pattern: ".*send.*"
      risk_level: MEDIUM
      category: COMMUNICATION
    - pattern: ".*update.*|.*write.*|.*push.*|.*create.*|.*insert.*|.*modify.*|.*edit.*|.*upload.*"
      risk_level: MEDIUM
      category: GENERIC_WRITE

# Named tools that always require human approval, regardless of prefix rules.
always_hold:
  - execute_code
  - run_command
  - deploy
  - git_reset
  - merge_pr

# Named tools that are always safe, regardless of pattern matches.
always_allow:
  - web_search
  - git_log
  - git_status
  - git_diff
  - git_show

# Fallback for tools not matched by any rule above.
default_action: hold
