version: "1.0"

# Tools that require human approval before execution
mutating_tools:
  - file_write
  - file_delete
  - file_move
  - file_rename
  - execute_code
  - run_command
  - send_email
  - send_message
  - db_insert
  - db_update
  - db_delete
  - api_post
  - api_put
  - api_patch
  - api_delete
  - deploy
  - git_push
  - git_commit
  - git_reset
  - create_pr
  - merge_pr
  - create_branch
  - delete_branch

# Tools that are always safe (never held)
safe_tools:
  - file_read
  - file_list
  - file_stat
  - search
  - web_search
  - db_query
  - api_get
  - git_log
  - git_status
  - git_diff
  - git_show
  - list_prs

# Default action for tools not in either list above
# "hold" requires approval; "allow" proceeds immediately
default_action: hold
